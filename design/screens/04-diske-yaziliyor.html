<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Inlay — Diske yazılıyor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffb38a}a:hover{color:#ffd2b8}
@keyframes inlay-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.inlay-spin{animation:none!important}}
</style>
</head>
<body>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(70% 60% at 0% 0%, #20222a, transparent 70%), #0f1013; color: #ececef; font-family: 'Geist', 'Segoe UI Variable Text', sans-serif; font-size: 15px; line-height: 1.45">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column; filter: blur(6px); opacity: 0.6">
    <div style="height: 44px"></div>
    <div style="height: 50px"></div>
    <div style="flex: 1; margin: 0 14px 82px; border-radius: 18px; background: #17181c; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06)"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8, 8, 10, 0.55)"></div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, rgba(255, 106, 43, 0.16), transparent 60%)"></div>

  <section role="dialog" aria-labelledby="burn-h" style="position: absolute; left: 50%; top: 50%; width: 580px; translate: -50% -50%; box-sizing: border-box; padding: 30px; border-radius: 22px; background: linear-gradient(180deg, rgba(34, 35, 41, 0.92), rgba(24, 25, 29, 0.92)); backdrop-filter: blur(30px); box-shadow: 0 40px 100px -30px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; gap: 24px">
    <div style="display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 22px; align-items: center">
      <div class="inlay-spin" aria-hidden="true" style="position: relative; width: 104px; height: 104px; border-radius: 50%; overflow: hidden; animation: inlay-spin 2.6s linear infinite; box-shadow: 0 14px 28px -12px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.14)">
        <img src="../img/film-hero.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
        <span style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #1c1d22 0 8%, rgba(255, 255, 255, 0.8) 8.5% 10%, #c9ccd2 10.5% 17%, transparent 17.5%), linear-gradient(135deg, rgba(255, 255, 255, 0.35), transparent 45%)"></span>
      </div>
      <div>
        <h1 id="burn-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Diske yazılıyor</h1>
        <span style="color: #9a9ca6">Kuzey Rüzgârı · DVD-R · E:</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">%62</span><span style="color: #9a9ca6">yaklaşık 4 dakika kaldı</span></div>
      <div role="progressbar" aria-label="Yazma ilerlemesi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62" style="height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.07)"><div style="width: 62%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ff8a3d, #ff5a1f); box-shadow: 0 0 16px -2px #ff5a1f"></div></div>
      <span style="color: #6d6f78; font-size: 13.5px">2,73 / 4,40 GB · 8x</span>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; color: #c9cad1"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #ff5a1f">Bitince kontrol et ve diski çıkar</label>

    <div style="display: flex; justify-content: flex-end">
      <button style="height: 42px; padding: 0 22px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, 0.07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); color: #ececef; font: inherit">İptal</button>
    </div>
  </section>
</div>
</body>
</html>
