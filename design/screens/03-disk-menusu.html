<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Inlay — Disk menüsü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffb38a}a:hover{color:#ffd2b8}
</style>
</head>
<body>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(70% 60% at 0% 0%, #20222a, transparent 70%), #0f1013; color: #ececef; font-family: 'Geist', 'Segoe UI Variable Text', sans-serif; font-size: 15px; line-height: 1.45">

  <header style="height: 44px; flex: none; display: flex; align-items: center; padding-left: 18px; font-size: 13px; color: #9a9ca6">
    <span style="display: flex; align-items: center; gap: 10px; flex: 1"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, #0f1013 0 20%, transparent 21%), conic-gradient(from 30deg, #ff8a3d, #ff5a1f, #ffb38a, #ff8a3d)"></span><span style="color: #ececef; font-weight: 600">Inlay</span><span>/ Kuzey Rüzgârı</span></span>
    <button aria-label="Küçült" style="width: 46px; height: 44px; border: 0; background: none; color: #9a9ca6; display: grid; place-items: center"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2"></path></svg></button>
    <button aria-label="Ekranı kapla" style="width: 46px; height: 44px; border: 0; background: none; color: #9a9ca6; display: grid; place-items: center"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"></rect></svg></button>
    <button aria-label="Kapat" style="width: 46px; height: 44px; border: 0; background: none; color: #9a9ca6; display: grid; place-items: center"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2"></path></svg></button>
  </header>

  <div style="display: flex; align-items: center; gap: 6px; padding: 2px 18px 12px">
    <a href="02-disk-icerigi.html" style="height: 36px; padding: 0 12px; border-radius: 10px; color: #c9cad1; text-decoration: none; display: inline-flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Disk içeriği</a>
    <span style="margin-left: 6px; font-weight: 600">Disk menüsü</span>
    <div style="flex: 1"></div>
    <button style="height: 36px; padding: 0 16px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); color: #ececef; font: inherit">HTML olarak düzenle</button>
  </div>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; margin: 0 14px">
    <main style="position: relative; border-radius: 18px; overflow: hidden; background: #0b0b0d; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); display: grid; place-items: center">
      <img src="../img/film-hero.jpg" alt="" style="position: absolute; inset: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover; filter: blur(60px); opacity: 0.35">
      <figure aria-label="Menü önizlemesi" style="position: relative; margin: 0; width: 880px; height: 495px; border-radius: 12px; overflow: hidden; background: #0c0d0f; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1)">
        <img src="../img/film-hero.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%">
        <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12, 13, 15, 0.82) 0%, rgba(12, 13, 15, 0.3) 48%, rgba(12, 13, 15, 0) 72%), linear-gradient(0deg, rgba(12, 13, 15, 0.85) 0%, rgba(12, 13, 15, 0) 45%)"></span>
        <span style="position: absolute; left: 48px; bottom: 50px; display: flex; flex-direction: column; gap: 10px; color: #f6f2ec">
          <span style="font-size: 12px; color: rgba(246, 242, 236, 0.75)">2023 · Macera · 2 sa 2 dk</span>
          <span style="font-size: 56px; font-weight: 600; letter-spacing: -0.035em; line-height: 0.92">Kuzey Rüzgârı</span>
          <span style="display: flex; gap: 8px; margin-top: 8px"><span style="height: 34px; padding: 0 20px; border-radius: 999px; background: #f6f2ec; color: #121314; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center">İzle</span><span style="height: 34px; padding: 0 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); font-size: 13px; display: inline-flex; align-items: center">Bölümler</span></span>
        </span>
      </figure>
    </main>

    <aside aria-label="Menü ayarları" style="border-radius: 18px; background: linear-gradient(180deg, #17181c, #131417); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); display: flex; flex-direction: column; gap: 22px; padding: 22px">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #6d6f78">Şablon</span>
        <div role="radiogroup" aria-label="Şablon" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button role="radio" aria-checked="true" style="display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; color: #ececef; font: inherit; font-size: 13.5px; text-align: left"><img src="../img/film-hero.jpg" alt="" style="width: 100%; height: 70px; object-fit: cover; border-radius: 10px; box-shadow: 0 0 0 2px #15161a, 0 0 0 4px #ff5a1f">Sinema</button>
          <button role="radio" aria-checked="false" style="display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; color: #9a9ca6; font: inherit; font-size: 13.5px; text-align: left"><img src="../img/g1.jpg" alt="" style="width: 100%; height: 70px; object-fit: cover; border-radius: 10px; filter: grayscale(0.2) brightness(1.05)">Sade</button>
        </div>
      </section>
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #6d6f78">Disk takılınca</span>
        <select style="height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); color: #ececef; font: inherit">
          <option>Menüyü göster</option><option>Filmi hemen oynat</option>
        </select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #6d6f78">Disk adı</span>
        <input value="Kuzey Rüzgârı" style="height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); color: #ececef; font: inherit">
      </label>
      <div style="display: flex; align-items: center; gap: 12px">
        <img src="../img/film-poster.jpg" alt="Disk simgesi" style="width: 46px; height: 46px; object-fit: cover; border-radius: 12px">
        <span style="color: #c9cad1; font-size: 14px">Disk simgesi afişten alındı<span style="display: block"><a href="#">Değiştir</a></span></span>
      </div>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.06)"><span>Kumanda ile gezinme</span><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #ff5a1f"></label>
    </aside>
  </div>

  <footer style="flex: none; display: flex; justify-content: flex-end; gap: 10px; padding: 16px 26px 18px">
    <a href="02-disk-icerigi.html" style="height: 44px; padding: 0 22px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); color: #ececef; text-decoration: none; display: inline-flex; align-items: center">Tamam</a>
    <a href="04-diske-yaziliyor.html" style="height: 44px; padding: 0 26px; border-radius: 12px; background: linear-gradient(135deg, #ff8a3d, #ff5a1f); color: #ffffff; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; box-shadow: 0 10px 24px -10px #ff5a1f, inset 0 1px 0 rgba(255, 255, 255, 0.25)">Diske yaz</a>
  </footer>
</div>
</body>
</html>
