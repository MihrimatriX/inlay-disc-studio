<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Şablon — Galeri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..700&amp;display=swap">
<style>
body{margin:0}
a{color:#2a2a26}a:hover{color:#000000}
</style>
</head>
<body>
<div style="width: 1440px; height: 810px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; padding: 48px 64px; overflow: hidden; background: #f7f6f2; color: #1f1f1c; font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">

  <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
    <div>
      <h1 style="margin: 0; font-size: 48px; font-weight: 500; letter-spacing: -0.03em; line-height: 1">Yolculuk 2025</h1>
      <span style="color: #6b6a63; font-size: 17px">Haziran – Ağustos · 128 fotoğraf</span>
    </div>
    <button style="height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: #1f1f1c; color: #f7f6f2; font: inherit; font-weight: 500; font-size: 16px; display: inline-flex; align-items: center; gap: 10px"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>Slayt gösterisi</button>
  </header>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button aria-label="Santorini" style="grid-column: span 2; padding: 0; border: 0; overflow: hidden; border-radius: 4px"><img src="../img/g1.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button aria-label="Kanal kıyısı" style="padding: 0; border: 0; overflow: hidden; border-radius: 4px"><img src="../img/g2.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button aria-label="Tekne" style="grid-row: span 2; padding: 0; border: 0; overflow: hidden; border-radius: 4px"><img src="../img/g3.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button aria-label="Çiçekler" style="padding: 0; border: 0; overflow: hidden; border-radius: 4px"><img src="../img/g4.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button aria-label="Balon" style="padding: 0; border: 0; overflow: hidden; border-radius: 4px"><img src="../img/g5.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button aria-label="Kıyıdaki inek" style="padding: 0; border: 0; overflow: hidden; border-radius: 4px"><img src="../img/g6.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
  </div>
</div>
</body>
</html>
