<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Şablon — Albüm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..700&amp;display=swap">
<style>
body{margin:0}
a{color:#f3e7d3}a:hover{color:#ffffff}
</style>
</head>
<body>
<div style="width: 1440px; height: 810px; box-sizing: border-box; position: relative; overflow: hidden; background: #1a1712; color: #f4efe6; font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">
  <img src="../img/album.jpg" alt="" style="position: absolute; inset: -80px; width: calc(100% + 160px); height: calc(100% + 160px); object-fit: cover; filter: blur(70px) saturate(1.1); opacity: 0.55">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20, 17, 13, 0.55)"></div>

  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: 500px minmax(0, 1fr); gap: 80px; align-items: center; padding: 0 96px">
    <img src="../img/album.jpg" alt="Akustik Oturumlar albüm kapağı" style="width: 500px; height: 500px; object-fit: cover; border-radius: 6px; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.8)">

    <section style="display: flex; flex-direction: column; gap: 10px; max-width: 560px">
      <h1 style="margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -0.03em; line-height: 1">Akustik Oturumlar</h1>
      <span style="font-size: 20px; font-weight: 300; color: rgba(244, 239, 230, 0.8)">side project GAMES · 2024</span>
      <div style="display: flex; gap: 12px; margin: 18px 0 14px">
        <button style="height: 50px; padding: 0 30px; border: 0; border-radius: 999px; background: #f4efe6; color: #1a1712; font: inherit; font-weight: 600; font-size: 17px; display: inline-flex; align-items: center; gap: 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>Çal</button>
        <button style="height: 50px; padding: 0 24px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.14); color: #f4efe6; font: inherit; font-size: 16px">Karışık çal</button>
      </div>
      <ol style="margin: 0; padding: 0; list-style: none; font-size: 17px">
        <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(244, 239, 230, 0.1)"><span style="color: rgba(244, 239, 230, 0.55)">1</span><span>Ana Tema</span><span style="color: rgba(244, 239, 230, 0.55)">3:21</span></li>
        <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(244, 239, 230, 0.1)"><span style="color: rgba(244, 239, 230, 0.55)">2</span><span>Köprü</span><span style="color: rgba(244, 239, 230, 0.55)">2:56</span></li>
        <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(244, 239, 230, 0.1)"><span style="color: rgba(244, 239, 230, 0.55)">3</span><span>Eve Dönüş</span><span style="color: rgba(244, 239, 230, 0.55)">3:39</span></li>
        <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(244, 239, 230, 0.1)"><span style="color: rgba(244, 239, 230, 0.55)">4</span><span>Yağmurlu Pazartesi</span><span style="color: rgba(244, 239, 230, 0.55)">2:42</span></li>
        <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(244, 239, 230, 0.1)"><span style="color: rgba(244, 239, 230, 0.55)">5</span><span>Son Sahne</span><span style="color: rgba(244, 239, 230, 0.55)">4:05</span></li>
        <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0"><span style="color: rgba(244, 239, 230, 0.55)">6</span><span>Jenerik</span><span style="color: rgba(244, 239, 230, 0.55)">2:18</span></li>
      </ol>
    </section>
  </div>
</div>
</body>
</html>
