<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Inlay — Disk içeriği</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;display=swap">
<style>
body{margin:0}
a{color:#ffb38a}a:hover{color:#ffd2b8}
</style>
</head>
<body>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(70% 60% at 0% 0%, #20222a, transparent 70%), #0f1013; color: #ececef; font-family: 'Geist', 'Segoe UI Variable Text', sans-serif; font-size: 15px; line-height: 1.45">

  <header style="height: 44px; flex: none; display: flex; align-items: center; padding-left: 18px; font-size: 13px; color: #9a9ca6">
    <span style="display: flex; align-items: center; gap: 10px; flex: 1"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, #0f1013 0 20%, transparent 21%), conic-gradient(from 30deg, #ff8a3d, #ff5a1f, #ffb38a, #ff8a3d)"></span><span style="color: #ececef; font-weight: 600">Inlay</span><span>/ Kuzey Rüzgârı</span></span>
    <button aria-label="Küçült" style="width: 46px; height: 44px; border: 0; background: none; color: #9a9ca6; display: grid; place-items: center"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2"></path></svg></button>
    <button aria-label="Ekranı kapla" style="width: 46px; height: 44px; border: 0; background: none; color: #9a9ca6; display: grid; place-items: center"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"></rect></svg></button>
    <button aria-label="Kapat" style="width: 46px; height: 44px; border: 0; background: none; color: #9a9ca6; display: grid; place-items: center"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2"></path></svg></button>
  </header>

  <div style="display: flex; align-items: center; gap: 6px; padding: 2px 18px 12px">
    <a href="01-baslangic.html" style="height: 36px; padding: 0 12px; border-radius: 10px; color: #c9cad1; text-decoration: none; display: inline-flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Geri</a>
    <span style="width: 1px; height: 20px; background: rgba(255, 255, 255, 0.1); margin: 0 6px"></span>
    <button style="height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.06); color: #ececef; font: inherit; display: inline-flex; align-items: center; gap: 7px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Ekle</button>
    <button style="height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: none; color: #c9cad1; font: inherit; display: inline-flex; align-items: center; gap: 7px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>Kaldır</button>
    <div style="flex: 1"></div>
    <a href="03-disk-menusu.html" style="height: 36px; padding: 0 16px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); color: #ececef; text-decoration: none; display: inline-flex; align-items: center; gap: 8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2.5"></rect><path d="M8 21h8"></path></svg>Disk menüsü</a>
  </div>

  <main style="flex: 1; min-height: 0; margin: 0 14px; border-radius: 18px; background: linear-gradient(180deg, #17181c, #131417); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); display: flex; flex-direction: column; overflow: hidden">
    <table style="width: 100%; border-collapse: collapse; font-size: 15px">
      <thead>
        <tr style="text-align: left; color: #6d6f78; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase">
          <th style="padding: 16px 24px 10px; font-weight: 500">Ad</th>
          <th style="padding: 16px 24px 10px; font-weight: 500; width: 240px">Tür</th>
          <th style="padding: 16px 24px 10px; font-weight: 500; width: 140px; text-align: right">Boyut</th>
        </tr>
      </thead>
      <tbody>
        <tr style="background: linear-gradient(90deg, rgba(255, 106, 43, 0.14), rgba(255, 106, 43, 0.02))">
          <td style="padding: 10px 24px"><span style="display: flex; align-items: center; gap: 16px"><img src="../img/film-poster.jpg" alt="" style="width: 40px; height: 60px; object-fit: cover; border-radius: 6px; box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.8)"><span><b style="font-weight: 600">Kuzey Rüzgârı</b><span style="display: block; color: #9a9ca6; font-size: 13.5px">2023 · Macera · 2 sa 2 dk</span></span></span></td>
          <td style="padding: 10px 24px"><span style="padding: 4px 10px; border-radius: 999px; background: rgba(255, 106, 43, 0.16); color: #ffb38a; font-size: 13px">Film</span></td>
          <td style="padding: 10px 24px; text-align: right; font-variant-numeric: tabular-nums">4,21 GB</td>
        </tr>
        <tr style="border-top: 1px solid rgba(255, 255, 255, 0.05)">
          <td style="padding: 10px 24px"><span style="display: flex; align-items: center; gap: 16px"><img src="../img/ch1.jpg" alt="" style="width: 40px; height: 60px; object-fit: cover; border-radius: 6px"><span>Fragman</span></span></td>
          <td style="padding: 10px 24px"><span style="padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); color: #c9cad1; font-size: 13px">Video</span></td>
          <td style="padding: 10px 24px; text-align: right; font-variant-numeric: tabular-nums; color: #c9cad1">86 MB</td>
        </tr>
        <tr style="border-top: 1px solid rgba(255, 255, 255, 0.05)">
          <td style="padding: 10px 24px"><span style="display: flex; align-items: center; gap: 16px"><img src="../img/ch2.jpg" alt="" style="width: 40px; height: 60px; object-fit: cover; border-radius: 6px"><span>Kamera arkası</span></span></td>
          <td style="padding: 10px 24px"><span style="padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); color: #c9cad1; font-size: 13px">Video</span></td>
          <td style="padding: 10px 24px; text-align: right; font-variant-numeric: tabular-nums; color: #c9cad1">112 MB</td>
        </tr>
        <tr style="border-top: 1px solid rgba(255, 255, 255, 0.05)">
          <td style="padding: 10px 24px"><span style="display: flex; align-items: center; gap: 16px"><span aria-hidden="true" style="width: 40px; height: 60px; border-radius: 6px; background: rgba(255, 255, 255, 0.05); display: grid; place-items: center; color: #9a9ca6; font-size: 11px; font-weight: 600">SRT</span><span>Altyazı — İngilizce</span></span></td>
          <td style="padding: 10px 24px"><span style="padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); color: #c9cad1; font-size: 13px">Altyazı</span></td>
          <td style="padding: 10px 24px; text-align: right; font-variant-numeric: tabular-nums; color: #c9cad1">84 KB</td>
        </tr>
      </tbody>
    </table>
    <div style="flex: 1; margin: 16px 24px 24px; border: 1.5px dashed rgba(255, 255, 255, 0.1); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #6d6f78; font-size: 14px">Eklemek istediğin dosyaları buraya sürükle</div>
  </main>

  <footer style="flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; padding: 18px 26px 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div role="img" aria-label="4,40 GB / 4,7 GB kullanıldı" style="position: relative; height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.07)">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 51.8%; border-radius: 999px; background: linear-gradient(90deg, #ff8a3d, #ff5a1f); box-shadow: 0 0 16px -2px #ff5a1f"></span>
        <span style="position: absolute; left: 8.2%; top: -4px; bottom: -4px; width: 1px; background: rgba(255, 255, 255, 0.25)"></span>
        <span style="position: absolute; left: 55.3%; top: -5px; bottom: -5px; width: 2px; border-radius: 2px; background: #ececef"></span>
      </div>
      <div style="position: relative; height: 18px; font-size: 12.5px; color: #6d6f78">
        <span style="position: absolute; left: 8.2%; translate: -50% 0">CD 700 MB</span>
        <span style="position: absolute; left: 55.3%; translate: -50% 0; color: #ececef; font-weight: 500">DVD 4,7 GB</span>
        <span style="position: absolute; right: 0">DVD DL 8,5 GB</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="color: #c9cad1"><b style="color: #ececef; font-weight: 600">4,40 GB</b> · sığıyor</span>
      <a href="04-diske-yaziliyor.html" style="height: 44px; padding: 0 26px; border-radius: 12px; background: linear-gradient(135deg, #ff8a3d, #ff5a1f); color: #ffffff; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 9px; box-shadow: 0 10px 24px -10px #ff5a1f, inset 0 1px 0 rgba(255, 255, 255, 0.25)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>Diske yaz</a>
    </div>
  </footer>
</div>
</body>
</html>
